# =============================================================================
# Reverse proxy for on-premise ticketing deployment
#
# Replace YOUR_PORTAL_DOMAIN and YOUR_AGENDA_DOMAIN with actual domain names.
# Example: ticketing.city.com and ticketing-admin.city.com
#
# Both domains must resolve to this server's IP (DNS A records or /etc/hosts).
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # Portal domain: citizen frontend + backend API
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name YOUR_PORTAL_DOMAIN;

        # Citizen booking frontend
        location / {
            proxy_pass http://ticketing-portal:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API (strips /backend prefix before forwarding)
        # /backend/api/foo -> http://ticketing-service:80/api/foo
        location /backend/ {
            proxy_pass http://ticketing-service:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /backend;
        }
    }

    # -------------------------------------------------------------------------
    # Agenda domain: admin/worker frontend
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name YOUR_AGENDA_DOMAIN;

        location / {
            proxy_pass http://ticketing-agenda:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
